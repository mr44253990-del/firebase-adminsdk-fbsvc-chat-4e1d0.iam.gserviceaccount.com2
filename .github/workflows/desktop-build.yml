name: Desktop Build CI

on:
  push:
    branches:
      - "**"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:
    inputs:
      demo_email:
        description: "Demo account email for the Windows login/screenshot tour"
        required: true
      demo_password:
        description: "Demo account password for the Windows login/screenshot tour"
        required: true

permissions:
  contents: read

jobs:
  build-desktop:
    name: Convo Desktop (${{ matrix.os-name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows x64
            gradle-tasks: >-
              build
              packageDistributionForCurrentOS
            artifact-name: convo-desktop-windows-x64
            artifact-path: |
              desktop/build/compose/binaries/main/*
          - os: ubuntu-24.04-arm
            os-name: Linux arm64
            gradle-tasks: >-
              build
              packageDistributionForCurrentOS
            artifact-name: convo-desktop-linux-arm64
            artifact-path: |
              desktop/build/compose/binaries/main/*
          - os: ubuntu-latest
            os-name: Linux x64
            gradle-tasks: >-
              build
              packageDistributionForCurrentOS
            artifact-name: convo-desktop-linux-x64
            artifact-path: |
              desktop/build/compose/binaries/main/*

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: desktop

      - name: Build desktop app
        working-directory: desktop
        shell: bash
        run: ./gradlew ${{ matrix.gradle-tasks }} --no-daemon --stacktrace

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: warn

  windows-demo-tour:
    name: Windows demo run (login + screenshot tour)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: desktop

      - name: Run app with demo account and capture tour
        shell: bash
        working-directory: desktop
        env:
          CONVO_DEMO_EMAIL: ${{ inputs.demo_email }}
          CONVO_DEMO_PASSWORD: ${{ inputs.demo_password }}
          CONVO_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          mkdir -p "$GITHUB_WORKSPACE/screenshots"
          ./gradlew run --no-daemon &
          APP_PID=$!
          # The in-app automation signs in, walks the screens and exits by itself.
          for _ in $(seq 1 144); do
            sleep 5
            if ! kill -0 $APP_PID 2>/dev/null; then break; fi
          done
          kill $APP_PID 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/screenshots" || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: convo-desktop-windows-screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Assemble screen recording (MP4)
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg not found on runner; trying choco"
            choco install -y ffmpeg || true
          fi
          command -v ffmpeg || { echo "no ffmpeg available; skipping video"; exit 0; }
          ffmpeg -y -loglevel error -framerate 2 -i "$GITHUB_WORKSPACE/screenshots/shot_%04d.png" -pix_fmt yuv420p -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" "$GITHUB_WORKSPACE/convo-desktop-demo-tour.mp4"

      - name: Upload screen recording
        uses: actions/upload-artifact@v4
        with:
          name: convo-desktop-windows-demo-video
          path: convo-desktop-demo-tour.mp4
          if-no-files-found: warn

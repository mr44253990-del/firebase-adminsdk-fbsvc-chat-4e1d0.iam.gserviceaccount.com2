name: Deploy backend (Worker, Edge Functions, rules)

# Auto-deploys the server side whenever it changes, so the app never talks to an
# outdated Worker again (an outdated Worker answers every new route with
# "Missing required fields: token, title, body").
#
# Each job is skipped (not failed) until its repository secrets are added:
#   Cloudflare Worker : CLOUDFLARE_API_TOKEN  (+ optional CLOUDFLARE_ACCOUNT_ID, WORKER_NAME variables)
#   Supabase          : SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
#   Firebase rules    : FIREBASE_SERVICE_ACCOUNT  (the service-account JSON)
# Settings → Secrets and variables → Actions → New repository secret.

on:
  push:
    branches: ["**"]
    paths:
      - "cloudflare-worker.js"
      - "supabase/functions/**"
      - "firestore.rules"
      - "database.rules.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '54ff9e3c4c5908b14f410044be85b698' }}
      WORKER_NAME: ${{ vars.WORKER_NAME || 'solitary-hill-dcdc' }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check cloudflare-worker.js
      - name: Upload Worker (keeps every existing secret and binding)
        if: env.CF_TOKEN != ''
        run: |
          set -euo pipefail
          META='{"main_module":"worker.js","compatibility_date":"2026-10-01","keep_bindings":["secret_text","secret_key","plain_text","json","r2_bucket","kv_namespace","d1","service","queue","analytics_engine"]}'
          RES=$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "metadata=${META};type=application/json" \
            -F "worker.js=@cloudflare-worker.js;filename=worker.js;type=application/javascript+module")
          echo "$RES" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("success:", d.get("success")); [print("error:", e) for e in d.get("errors",[])]; sys.exit(0 if d.get("success") else 1)'
      - name: Verify the live Worker version
        if: env.CF_TOKEN != ''
        run: |
          sleep 8
          curl -sS "https://${WORKER_NAME}.mr44253990.workers.dev/" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("apiVersion", d.get("apiVersion"), "serviceAccount", d.get("serviceAccountConfigured")); sys.exit(0 if d.get("apiVersion") else 1)'
      - name: Skipped
        if: env.CF_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN repository secret to auto-deploy the Worker."

  supabase:
    name: Supabase Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          version: latest
      - name: Deploy presence-monitor and auto-ai-post
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          set -euo pipefail
          supabase functions deploy presence-monitor --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy auto-ai-post --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
      - name: Skipped
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: echo "::notice::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF secrets to auto-deploy Edge Functions."

  rules:
    name: Firebase rules
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Firestore + Realtime Database rules
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT=$(python3 -c 'import json,os; print(json.load(open(os.environ["GOOGLE_APPLICATION_CREDENTIALS"]))["project_id"])')
          npx --yes firebase-tools@latest deploy --only firestore:rules,database --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Skipped
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::notice::Add the FIREBASE_SERVICE_ACCOUNT secret to auto-deploy security rules."

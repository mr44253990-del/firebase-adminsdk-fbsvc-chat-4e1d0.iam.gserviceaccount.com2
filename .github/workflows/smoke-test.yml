name: Emulator smoke test

# Boots the app on an Android emulator and prints any crash stack trace.
# Runs only when the commit message contains [smoke] (or manually).
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke]')
    name: Launch app on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build an x86_64 test APK (debug-signed release, test only)
        run: |
          set -euo pipefail
          chmod +x gradlew || gradle wrapper
          # Test build only: allow the emulator ABI and sign with the debug key.
          sed -i 's/abiFilters += listOf("arm64-v8a")/abiFilters += listOf("arm64-v8a", "x86_64")/' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/' app/build.gradle.kts
          mkdir -p app/src/main/assets/worker
          cp cloudflare-worker.js app/src/main/assets/worker/cloudflare-worker.js
          ./gradlew --no-daemon assembleRelease
          find app/build/outputs/apk -name '*.apk'

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke/
